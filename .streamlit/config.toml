[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

chartCategoricalColors = ["#2563EB", "#059669", "#D97706", "#7C3AED", "#DC2626", "#0891B2"]

blueColor = "#2563EB"
greenColor = "#059669"
yellowColor = "#D97706"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
grayColor = "#475569"

[theme.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#CBD5E1"
